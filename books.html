
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books Information</title>
</head>
<body>

    <h1>Book Information</h1>

    <p>
        <strong>Title of the first book:</strong>
        <span id="firstTitle"></span>
    </p>

    <p>
        <strong>Author of the second book:</strong>
        <span id="secondAuthor"></span>
    </p>

    <h2>Genres by Book</h2>

    <div id="genres"></div>

    <p id="error" style="color:red;"></p>

    <script>
        async function loadBooks() {

            try {
                // Step 1: Fetch JSON file
                const response = await fetch("books.json");

                // Step 2: Check response
                if (!response.ok) {
                    throw new Error("Failed to load JSON file");
                }

                // Step 3: Convert response into JSON
                const data = await response.json();

                // Step 4: Check book data
                if (!Array.isArray(data.books) ||
                    data.books.length < 2) {
                    throw new Error("Invalid book data");
                }

                // Step 5: Display first book title
                document.getElementById("firstTitle")
                    .textContent = data.books[0].title;

                // Step 6: Display second book author
                document.getElementById("secondAuthor")
                    .textContent = data.books[1].author;

                // Step 7: Display genres of both books
                const genresDiv =
                    document.getElementById("genres");

                data.books.forEach(function(book) {

                    const bookDiv =
                        document.createElement("div");

                    const heading =
                        document.createElement("h3");

                    heading.textContent = book.title;

                    const paragraph =
                        document.createElement("p");

                    paragraph.textContent =
                        book.genres.join(", ");

                    bookDiv.appendChild(heading);
                    bookDiv.appendChild(paragraph);

                    genresDiv.appendChild(bookDiv);
                });

            } catch (error) {

                document.getElementById("error")
                    .textContent =
                    "Error: Unable to load book information.";

                console.error(error);
            }
        }

        // Run the function
        loadBooks();

    </script>

</body>
</html>
